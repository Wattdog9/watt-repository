<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi des dossiers PRSEB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Mise en page : bandeau d'en-tête + circuit du dossier (DE → CF → DE → AC), puis tableaux de travail sur une colonne de 1200px */
:root {
  /* Bleu (structure, en-tête), blanc (surfaces), orange (actions, CF), vert (paiement, AC, dans les délais) */
  --bg: #f2f7fc;
  --surface: #ffffff;
  --surface-2: #e9f1fa;
  --ink: #0f2540;
  --muted: #50647d;
  --line: #d3e0ee;
  --brand: #0d4f8b;
  --brand-ink: #ffffff;
  --brand-muted: #cfe0f2;
  --heading: #0d4f8b;
  --accent: #1565c0;
  --accent-ink: #ffffff;
  --cta: #f28c28;
  --cta-ink: #13263f;
  --de: #1565c0;
  --cf: #e8780c;
  --ac: #2e8b3e;
  --ok: #2e7d32;
  --warn: #b86e00;
  --bad: #c62828;
  --ok-bg: #e6f4e8;
  --warn-bg: #fff1e0;
  --bad-bg: #fde7e7;
  --shadow: 0 1px 2px rgba(23,35,58,.06), 0 4px 16px rgba(23,35,58,.06);
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1a2c; --surface: #11243b; --surface-2: #18304d; --ink: #e7eef7; --muted: #9db0c6; --line: #24405f;
    --brand: #0a3a66; --brand-ink: #ffffff; --brand-muted: #a9c2dd; --heading: #9cc8ff;
    --accent: #6fb1ff; --accent-ink: #0b1a2c; --cta: #f5973a; --cta-ink: #13263f; --de: #6fb1ff; --cf: #f5a04d; --ac: #5cc76a;
    --ok: #66c97a; --warn: #f0b34a; --bad: #ff8a80; --ok-bg: #12301c; --warn-bg: #3a2a10; --bad-bg: #3d1818;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1a2c; --surface: #11243b; --surface-2: #18304d; --ink: #e7eef7; --muted: #9db0c6; --line: #24405f;
  --brand: #0a3a66; --brand-ink: #ffffff; --brand-muted: #a9c2dd; --heading: #9cc8ff;
  --accent: #6fb1ff; --accent-ink: #0b1a2c; --cta: #f5973a; --cta-ink: #13263f; --de: #6fb1ff; --cf: #f5a04d; --ac: #5cc76a;
  --ok: #66c97a; --warn: #f0b34a; --bad: #ff8a80; --ok-bg: #12301c; --warn-bg: #3a2a10; --bad-bg: #3d1818;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.15; }
h2 { font-size: 1.6rem; color: var(--heading); }
h3 { font-size: 1.2rem; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* En-tête */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--brand); color: var(--brand-ink); border-bottom: 3px solid var(--cta); }
.top-inner { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; border-radius: 6px; background: var(--cta); color: var(--cta-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1rem; flex: none; }
.brand h1 { font-size: 1.35rem; }
.brand small { display: block; color: var(--brand-muted); font-size: .78rem; font-family: var(--font-body); font-weight: 400; letter-spacing: 0; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav.tabs button { background: none; border: 0; padding: 8px 10px; border-radius: 6px; cursor: pointer; color: var(--brand-muted); font-weight: 600; font-size: .9rem; }
nav.tabs button:hover { background: rgba(255,255,255,.12); color: var(--brand-ink); }
nav.tabs button[aria-current="page"] { color: var(--brand-ink); background: rgba(255,255,255,.16); box-shadow: inset 0 -3px 0 var(--cta); border-radius: 6px 6px 0 0; }
header.top :focus-visible { outline-color: var(--cta); }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: .9rem; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--cta); border-color: var(--cta); color: var(--cta-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.small { padding: 5px 10px; font-size: .82rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

main { padding-block: 24px 64px; display: grid; gap: 24px; }
section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
.grid-2 > * { min-width: 0; }

.demo-banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; border: 1px dashed var(--warn); background: var(--warn-bg); border-radius: 8px; font-size: .9rem; }

/* Circuit */
.circuit { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; align-items: stretch; }
.station { position: relative; padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); display: grid; gap: 4px; min-width: 0; }
.station + .station { border-left: 0; }
.station:first-child { border-radius: 10px 0 0 10px; }
.station:last-child { border-radius: 0 10px 10px 0; }
.station .who { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; }
.station .who i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.station .big { font-family: var(--font-mono); font-size: 2rem; font-weight: 500; line-height: 1.1; }
.station .sub { font-size: .8rem; color: var(--muted); }
.station .late { color: var(--bad); font-weight: 600; }
.station::after { content: "→"; position: absolute; right: -9px; top: 50%; transform: translateY(-50%); background: var(--bg); color: var(--muted); font-size: .9rem; z-index: 1; line-height: 1; padding: 2px 0; }
.station:last-child::after { display: none; }
@media (max-width: 820px) {
  .circuit { grid-template-columns: 1fr 1fr; gap: 8px; }
  .station, .station + .station { border: 1px solid var(--line); border-radius: 10px !important; }
  .station::after { display: none; }
}

/* Indicateurs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; border-radius: 8px; background: var(--surface-2); display: grid; gap: 2px; }
.kpi .v { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 500; color: var(--heading); }
.carte-diff { display: grid; gap: 12px; min-width: 0; }
.carte-diff h3 { display: flex; align-items: center; gap: 8px; }
.carte-diff h3 i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.carte-diff .kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.chip.warn { color: var(--warn); }
.kpi.vert { background: var(--ok-bg); } .kpi.vert .v { color: var(--ok); }
.kpi.orange { background: var(--warn-bg); } .kpi.orange .v { color: var(--warn); }
.kpi .v small { font-size: .85rem; color: var(--muted); }

/* Barres de délai */
.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: 150px 1fr 70px; gap: 12px; align-items: center; }
.bar-track { position: relative; height: 14px; background: var(--surface-2); border-radius: 3px; }
.bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--c); }
.bar-limit { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .55; }
.bar-axis { display: grid; grid-template-columns: 150px 1fr 70px; gap: 12px; font-size: .72rem; color: var(--muted); }
.bar-axis .ticks { position: relative; height: 14px; }
.bar-axis .ticks span { position: absolute; transform: translateX(-50%); font-family: var(--font-mono); }
@media (max-width: 520px) { .bar-row, .bar-axis { grid-template-columns: 90px 1fr 56px; gap: 8px; } }

/* Tableaux */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); background: var(--surface-2); font-weight: 600; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--surface-2); }
td.r, th.r { text-align: right; }
.ref { font-family: var(--font-mono); font-weight: 600; white-space: nowrap; }
.objet { max-width: 340px; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

/* Pastilles */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; border: 1px solid currentColor; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.DE { color: var(--de); } .chip.CF { color: var(--cf); } .chip.AC { color: var(--ac); }
.chip.paye { color: var(--ok); } .chip.rejete { color: var(--bad); }
.clock { display: inline-grid; gap: 3px; min-width: 92px; }
.clock .t { font-family: var(--font-mono); font-size: .82rem; white-space: nowrap; }
.clock .g { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.clock .g b { display: block; height: 100%; background: var(--ok); }
.clock.alerte .g b { background: var(--warn); } .clock.alerte .t { color: var(--warn); }
.clock.retard .g b { background: var(--bad); } .clock.retard .t { color: var(--bad); font-weight: 600; }

/* Cachets (visa / différé / rejet) */
.stamp { display: inline-block; font-family: var(--font-display); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .78rem; padding: 1px 8px; border: 2px solid currentColor; border-radius: 4px; transform: rotate(-2deg); white-space: nowrap; }
.stamp.vise, .stamp.paye { color: var(--ok); }
.stamp.differe { color: var(--warn); }
.stamp.rejete { color: var(--bad); }
.stamp.transmis { color: var(--muted); border-style: dashed; transform: none; }

/* Filtres */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.filters input[type="search"] { flex: 1 1 220px; min-width: 0; }
input[type="text"], input[type="search"], input[type="number"], input[type="date"], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-width: 100%; }
textarea { width: 100%; resize: vertical; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 7px 11px; cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
label.check { display: inline-flex; gap: 6px; align-items: center; font-size: .88rem; cursor: pointer; }

/* Alertes */
.alerts { display: grid; gap: 8px; }
.alert { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px 10px 0; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
.alert:hover { border-color: var(--accent); }
.alert > i { align-self: stretch; border-radius: 8px 0 0 8px; background: var(--warn); }
.alert.retard > i { background: var(--bad); }
.alert .t { min-width: 0; }
.alert .t div:first-child { font-weight: 600; overflow-wrap: anywhere; }

/* Dialogue */
dialog { border: 0; padding: 0; border-radius: 12px; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10,16,28,.45); }
.dlg { display: grid; gap: 18px; padding: 22px; }
.dlg-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.x { background: none; border: 0; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 6px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field input, .field select, .field textarea { width: 100%; }
.actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.err { color: var(--bad); font-size: .85rem; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 14px; background: var(--surface-2); border-radius: 8px; }
.meta div { min-width: 0; overflow-wrap: anywhere; }

/* Chronologie */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 20px 1fr; gap: 12px; }
.timeline .rail { position: relative; display: flex; justify-content: center; }
.timeline .rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line); }
.timeline li:first-child .rail::before { top: 14px; }
.timeline li:last-child .rail::before { bottom: calc(100% - 14px); }
.timeline .dot { position: relative; margin-top: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--c); }
.timeline .body { padding-bottom: 16px; min-width: 0; }
.timeline .row1 { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.timeline .row1 strong { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; }
.timeline .motif { margin-top: 4px; font-size: .88rem; padding: 6px 10px; border-left: 3px solid var(--line); background: var(--surface-2); border-radius: 0 6px 6px 0; overflow-wrap: anywhere; }

.action-box { border: 1px solid var(--accent); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.radio-row { display: flex; flex-wrap: wrap; gap: 8px; }
.radio-row label { display: inline-flex; gap: 6px; align-items: center; padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-weight: 600; font-size: .9rem; }
.radio-row label:has(input:checked) { border-color: var(--accent); background: var(--surface-2); }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; background: var(--bad-bg); border-radius: 8px; font-size: .9rem; }

.session { display: flex; align-items: center; gap: 4px; font-size: .82rem; font-weight: 600; }
.chip.lecture { color: var(--muted); }
.err .lien { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: underline; font-size: inherit; }
.session { color: var(--brand-ink); }
.btn-partage { display: inline-flex; align-items: center; gap: 7px; background: rgba(255,255,255,.12); color: var(--brand-ink); border: 1px solid rgba(255,255,255,.35); border-radius: 6px; padding: 7px 12px; font-weight: 600; font-size: .85rem; cursor: pointer; }
.btn-partage:hover { background: rgba(255,255,255,.22); }
.btn-partage i { width: 8px; height: 8px; border-radius: 50%; background: var(--ac); box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
.droits { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.droits li { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }
.droits strong { font-family: var(--font-display); font-size: 1.02rem; font-weight: 600; }
.lien-partage { display: flex; gap: 8px; flex-wrap: wrap; }
.lien-partage input { flex: 1 1 260px; min-width: 0; font-family: var(--font-mono); font-size: .85rem; }
@media (max-width: 520px) { .droits li { grid-template-columns: 1fr; gap: 2px; } }
.session .muted, .session .chip.lecture { color: var(--brand-muted); }
.session .lien { background: none; border: 0; padding: 4px 6px; color: var(--brand-muted); cursor: pointer; font-weight: 600; font-size: .82rem; text-decoration: underline; }
@media (max-width: 1320px) { .brand small { display: none; } }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: .9rem; z-index: 50; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 5px; border-radius: 3px; display: inline-block; }
.help { font-size: .85rem; color: var(--muted); max-width: 70ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">PR</div>
      <h1>Suivi des dossiers PRSEB<small>Direction exécutive · Contrôle financier · Agent comptable</small></h1>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button data-tab="tableau">Tableau de bord</button>
      <button data-tab="dossiers">Dossiers</button>
      <button data-tab="differes">Différés</button>
      <button data-tab="rapports">Rapports</button>
      <button data-tab="parametres">Paramètres</button>
    </nav>
    <div class="session" id="session"></div>
    <button class="btn primary" id="btn-nouveau">+ Nouveau dossier</button>
  </div>
</header>

<main class="wrap" id="app"></main>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";

  // ---------- Référentiels ----------
  var ACTEURS = {
    DE: { nom: "Direction exécutive", court: "DE", couleur: "var(--de)" },
    CF: { nom: "Contrôle financier", court: "CF", couleur: "var(--cf)" },
    AC: { nom: "Agent comptable", court: "AC", couleur: "var(--ac)" }
  };
  var DECISIONS = { transmis: "Transmis", vise: "Visé", differe: "Différé", rejete: "Rejeté", paye: "Payé" };
  var NATURES = ["Marché / contrat", "Frais de mission", "Formation / atelier", "Fonctionnement", "Indemnités / salaires", "Autre"];
  var CLE = "prseb-suivi-dossiers-v1";

  var defautParams = {
    delais: { DE: 5, CF: 5, AC: 5 },
    feries: "01-01\n05-01\n08-15\n11-01\n12-25",
    devise: "FCFA"
  };

  // ---------- Dates & jours ouvrables ----------
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function aujourdhui() { return iso(new Date()); }

  var cacheFeries = null;
  function feries() {
    if (cacheFeries) return cacheFeries;
    var annuels = {}, fixes = {};
    String(etat.params.feries || "").split(/[\s,;]+/).forEach(function (l) {
      l = l.trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(l)) fixes[l] = true;
      else if (/^\d{2}-\d{2}$/.test(l)) annuels[l] = true;
    });
    cacheFeries = { annuels: annuels, fixes: fixes };
    return cacheFeries;
  }
  function estOuvrable(d) {
    var j = d.getDay();

      p = col.doc(op.d.id).set(propre(op.d));
    } else if (op.type === "suppr") p = col.doc(op.d.id).delete();
    else if (op.type === "params") p = cdb.db.doc("config/params").set(propre(etat.params));
    else {
      // Remplacement complet (import, effacement) : une écriture à la fois.
      var cibles = {};
      etat.dossiers.forEach(function (d) { cibles[d.id] = d; });
      p = col.get().then(function (snap) {
        var ch = Promise.resolve();
        snap.docs.forEach(function (doc) { if (!cibles[doc.id]) ch = ch.then(function () { return col.doc(doc.id).delete(); }); });
        if (op.type === "tout") etat.dossiers.forEach(function (d) { ch = ch.then(function () { return col.doc(d.id).set(propre(d)); }); });
        if (op.type === "tout") ch = ch.then(function () { return cdb.db.doc("config/params").set(propre(etat.params)); });
        return ch;
      });
    }

  }

  function persister(op) {

  function enCours() { return etat.dossiers.filter(function (d) { return d.statut === "en_cours"; }); }

  function vueTableau() {
    var actifs = enCours();
    var parPos = { DE: [], CF: [], AC: [] };
    actifs.forEach(function (d) { var c = courante(d); if (c) parPos[c.acteur].push(d); });
    function nbRetard(list) { return list.filter(function (d) { return niveau(courante(d)) === "retard"; }).length; }
    var deApresCF = parPos.DE.filter(function (d) { return d.etapes.length > 1; });
    var deNouveaux = parPos.DE.filter(function (d) { return d.etapes.length === 1; });

    var rejetes = etat.dossiers.filter(function (d) { return d.statut === "rejete"; }).length;

    function station(titre, c, list, sub) {
      var r = list ? nbRetard(list) : 0;

    }

    html += '<div class="circuit">' +
      station("DE · préparation", "var(--de)", deNouveaux) +
      station("Contrôle financier", "var(--cf)", parPos.CF) +
      station("DE · retour du CF/AC", "var(--de)", deApresCF) +
      station("Agent comptable", "var(--ac)", parPos.AC) +
      station("Clôturés", "var(--ok)", null, { n: payes + rejetes, t: payes + " payé(s) · " + rejetes + " rejeté(s)" }) +
      "</div></section>";

    // Indicateurs
    var st = statsActeurs(etat.dossiers);
    var toutes = [], dansDelai = 0;
    etat.dossiers.forEach(function (d) { d.etapes.forEach(function (e) { if (e.fin) { toutes.push(e); if (duree(e) <= delai(e.acteur)) dansDelai++; } }); });
    var totPayes = etat.dossiers.filter(function (d) { return d.statut === "paye"; });
    var moyCycle = totPayes.length ? totPayes.reduce(function (s, d) { return s + dureeTotale(d); }, 0) / totPayes.length : null;
    var nbALever = actifs.filter(differeEnCours).length;
    var nbEnRetard = actifs.filter(function (d) { return niveau(courante(d)) === "retard"; }).length;
    html += '<section class="panel"><div class="panel-head"><h2>Indicateurs</h2></div><div class="kpis">' +
      kpi("Dossiers en cours", actifs.length, "") +
      kpi("En retard", nbEnRetard, "dossier(s)", nbEnRetard ? "orange" : "") +
      kpi("Différés à lever", nbALever, "dossier(s)", nbALever ? "orange" : "") +
      kpi("Étapes dans les délais", toutes.length ? Math.round(dansDelai / toutes.length * 100) : "—", toutes.length ? "%" : "", "vert") +
      kpi("Délai moyen CF", f1(st.CF.moy), "j ouvr.") +
      kpi("Délai moyen AC", f1(st.AC.moy), "j ouvr.") +
      kpi("Cycle complet moyen", f1(moyCycle), "j ouvr.") +
      "</div></section>";

    // Alertes + barres
    var alertes = actifs.map(function (d) { return { d: d, e: courante(d) }; })
      .filter(function (x) { return niveau(x.e) !== "ok"; })
      .sort(function (a, b) { return (duree(b.e) - delai(b.e.acteur)) - (duree(a.e) - delai(a.e.acteur)); });
    html += '<div class="grid-2"><section class="panel"><div class="panel-head"><h3>À relancer</h3><span class="muted">' + alertes.length + " dossier(s)</span></div>";
    if (!alertes.length) html += '<div class="empty">Aucun dossier en alerte. Tous les acteurs sont dans les délais.</div>';
    else html += '<div class="alerts">' + alertes.map(function (x) {
      var n = duree(x.e), lim = delai(x.e.acteur), niv = niveau(x.e);
      return '<div class="alert ' + niv + '" data-open="' + x.d.id + '" tabindex="0" role="button"><i></i><div class="t"><div><span class="ref">' + h(x.d.ref) + "</span> · " + h(x.d.objet) + '</div><div class="muted" style="font-size:.82rem">Chez ' + ACTEURS[x.e.acteur].nom + " depuis le " + h(fd(x.e.debut)) + " · échéance " + h(fj(ajouterJO(x.e.debut, lim))) + "</div></div>" +
        '<span class="clock ' + niv + '"><span class="t">' + (n > lim ? "+" + (n - lim) + " j" : "J+" + n + "/" + lim) + "</span></span></div>";
    }).join("") + "</div>";
    html += "</section>";

    html += '<section class="panel"><div class="panel-head"><h3>Délai moyen de traitement</h3><span class="muted">étapes terminées</span></div>' + barres(st) + "</section></div>";
    return html;
  }
  function kpi(l, v, u, cls) { return '<div class="kpi' + (cls ? " " + cls : "") + '"><span class="label">' + l + '</span><span class="v">' + v + (u ? " <small>" + u + "</small>" : "") + "</span></div>"; }

  function barres(st) {
    var max = Math.max(10, Math.ceil(Math.max(st.DE.max || 0, st.CF.max || 0, st.AC.max || 0)));
    var html = '<div class="bars">';
    ["DE", "CF", "AC"].forEach(function (a) {
      var m = st[a].moy, lim = delai(a);
      html += '<div class="bar-row"><span style="font-weight:600;font-size:.88rem">' + ACTEURS[a].nom + '</span><div class="bar-track">' +
        (m != null ? '<div class="bar-fill" style="--c:' + (m > lim ? "var(--bad)" : ACTEURS[a].couleur) + ";width:" + (m / max * 100) + '%"></div>' : "") +
        '<div class="bar-limit" style="left:calc(' + (lim / max * 100) + '% - 1px)" title="Délai réglementaire : ' + lim + ' j"></div></div><span class="num" style="text-align:right">' + f1(m) + " j</span></div>";
    });
    var ticks = "";
    for (var i = 0; i <= max; i += max > 12 ? 5 : 2) ticks += '<span style="left:' + (i / max * 100) + '%">' + i + "</span>";
    html += '<div class="bar-axis"><span></span><div class="ticks">' + ticks + "</div><span></span></div>";
    html += '<div class="legend"><span><i style="background:var(--ink);opacity:.55;width:2px;height:12px"></i>Délai réglementaire</span><span><i style="background:var(--bad)"></i>Moyenne au-delà du délai</span></div></div>';
    return html;
  }

  function statsActeurs(dossiers, du, au) {
    var st = {};
    ["DE", "CF", "AC"].forEach(function (a) { st[a] = { n: 0, somme: 0, max: 0, dansDelai: 0, vise: 0, differe: 0, rejete: 0, paye: 0, encours: 0, retard: 0, moy: null }; });
    dossiers.forEach(function (d) {
      d.etapes.forEach(function (e) {
        if (du && e.debut < du) return;
        if (au && e.debut > au) return;
        var s = st[e.acteur], n = duree(e);
        if (!e.fin) { s.encours++; if (n > delai(e.acteur)) s.retard++; return; }
        s.n++; s.somme += n; s.max = Math.max(s.max, n);
        if (n <= delai(e.acteur)) s.dansDelai++;
        if (s[e.decision] != null) s[e.decision]++;
      });
    });
    Object.keys(st).forEach(function (a) { if (st[a].n) st[a].moy = st[a].somme / st[a].n; });
    return st;
  }

  function filtrer() {
    var q = ui.recherche.toLowerCase().trim();
    return etat.dossiers.filter(function (d) {
      var p = position(d);
      if (ui.position === "clos" && d.statut === "en_cours") return false;
      if (["DE", "CF", "AC"].indexOf(ui.position) >= 0 && (d.statut !== "en_cours" || p !== ui.position)) return false;
      if (ui.retardSeul) { var c = courante(d); if (!c || niveau(c) !== "retard") return false; }
      if (q && (d.ref + " " + d.objet + " " + d.beneficiaire + " " + d.nature).toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(triOP);
  }

  function vueDossiers() {
    var list = filtrer();
    var segs = [["tous", "Tous"], ["DE", "À la DE"], ["CF", "Au CF"], ["AC", "À l'AC"], ["clos", "Clôturés"]];
    var html = '<section class="panel"><div class="panel-head"><h2>Dossiers</h2><span class="muted">' + list.length + " sur " + etat.dossiers.length + "</span></div>";
    html += '<div class="filters"><input type="search" id="f-q" placeholder="Rechercher un n° d\'OP, un objet, un bénéficiaire…" value="' + h(ui.recherche) + '" aria-label="Rechercher">' +
      '<div class="seg" role="group" aria-label="Position">' + segs.map(function (s) { return '<button data-pos="' + s[0] + '" aria-pressed="' + (ui.position === s[0]) + '">' + s[1] + "</button>"; }).join("") + "</div>" +
      '<label class="check"><input type="checkbox" id="f-retard"' + (ui.retardSeul ? " checked" : "") + "> En retard uniquement</label></div>";
    if (!list.length) {
      html += '<div class="table-wrap"><div class="empty">' + (etat.dossiers.length ? "Aucun dossier ne correspond aux filtres." : ui.lecture ? "Aucun dossier n'a encore été enregistré." : "Aucun dossier pour l'instant. Cliquez sur « Nouveau dossier » pour enregistrer le premier.") + "</div></div></section>";
      return html;
    }
    html += '<div class="table-wrap"><table><thead><tr><th>N° OP</th><th>Objet</th><th>Bénéficiaire</th><th class="r">Montant</th><th>Position</th><th>Délai étape</th><th>Dernière décision</th><th class="r">Durée totale</th></tr></thead><tbody>';
    list.forEach(function (d) {
      var c = courante(d);
      var dern = d.etapes.slice().reverse().filter(function (e) { return e.decision && e.decision !== "transmis"; })[0];
      html += '<tr class="clickable" data-open="' + d.id + '" tabindex="0"><td class="ref">' + h(d.ref) + '</td><td class="objet">' + h(d.objet) + "</td><td>" + h(d.beneficiaire) + '</td><td class="r num">' + h(fm(d.montant)) + "</td><td>" + chipPos(d) + "</td><td>" + horloge(c) + "</td><td>" +
        (dern ? stamp(dern.decision) + ' <span class="muted" style="font-size:.78rem">' + dern.acteur + "</span>" : '<span class="muted">—</span>') + '</td><td class="r num">' + dureeTotale(d) + " j</td></tr>";
    });
    html += "</tbody></table></div></section>";
    return html;
  }

  // ---------- Différés ----------
  // Un différé = une étape CF/AC close par « différé », suivie de l'étape DE qui le lève
  // (renvoi du dossier) puis de l'étape de réexamen chez le même acteur.
  function differeEnCours(d) {
    var c = courante(d), i = d.etapes.indexOf(c);
    return c && c.acteur === "DE" && i > 0 && d.etapes[i - 1].decision === "differe" ? d.etapes[i - 1] : null;
  }
  function listeDifferes() {
    var res = [];
    etat.dossiers.forEach(function (d) {
      var rang = { CF: 0, AC: 0 };
      d.etapes.forEach(function (e, i) {
        if (e.decision !== "differe" || (e.acteur !== "CF" && e.acteur !== "AC")) return;
        rang[e.acteur]++;
        var lev = d.etapes[i + 1], rex = lev && lev.fin ? d.etapes[i + 2] : null, statut;
        if (!lev) statut = "traite";
        else if (!lev.fin) statut = d.statut === "en_cours" ? "a_lever" : "traite";
        else if (rex && !rex.fin) statut = d.statut === "en_cours" ? "reexamen" : "traite";
        else statut = "traite";
        res.push({ d: d, e: e, acteur: e.acteur, rang: rang[e.acteur], lev: lev, rex: rex, statut: statut, issue: rex && rex.fin ? rex.decision : d.statut === "rejete" && !rex ? "rejete" : null });
      });
    });
    return res.sort(function (a, b) { return a.e.fin < b.e.fin ? 1 : a.e.fin > b.e.fin ? -1 : triOP(a.d, b.d); });
  }
  function chipDiffere(x) {
    if (x.statut === "a_lever") return '<span class="chip DE"><i></i>À lever (DE)</span>';
    if (x.statut === "reexamen") return '<span class="chip ' + x.acteur + '"><i></i>En réexamen ' + x.acteur + "</span>";
    if (x.issue === "differe") return '<span class="chip warn"><i></i>Différé à nouveau</span>';
    if (x.issue === "rejete") return '<span class="chip rejete"><i></i>Rejeté</span>';
    if (x.issue === "vise" || x.issue === "paye") return '<span class="chip paye"><i></i>Levé · ' + DECISIONS[x.issue].toLowerCase() + "</span>";
    return '<span class="chip"><i></i>Clos</span>';
  }
  function moyenne(t) { return t.length ? t.reduce(function (s, v) { return s + v; }, 0) / t.length : null; }

  function vueDifferes() {
    var tous = listeDifferes();
    var html = '<section class="panel"><div class="panel-head"><h2>Suivi des différés</h2><span class="muted">Délai de levée : ' + delai("DE") + " j ouvrables à la DE · réexamen : " + delai("CF") + " j au CF, " + delai("AC") + " j à l'AC</span></div>";
    html += '<p class="help" style="margin:0 0 16px">Quand le Contrôle financier ou l\'Agent comptable diffère un dossier, la Direction exécutive le lève (pièces ou corrections) puis le renvoie pour réexamen. Chaque différé est suivi jusqu\'à la décision qui suit.</p>';
    html += '<div class="grid-2">';
    ["CF", "AC"].forEach(function (a) {
      var l = tous.filter(function (x) { return x.acteur === a; });
      var aLever = l.filter(function (x) { return x.statut === "a_lever"; });
      var retard = aLever.filter(function (x) { return niveau(x.lev) === "retard"; }).length;
      var rex = l.filter(function (x) { return x.statut === "reexamen"; });
      var leves = l.filter(function (x) { return x.issue === "vise" || x.issue === "paye"; }).length;
      var dLev = moyenne(l.filter(function (x) { return x.lev && x.lev.fin; }).map(function (x) { return duree(x.lev); }));
      var dRex = moyenne(l.filter(function (x) { return x.rex && x.rex.fin; }).map(function (x) { return duree(x.rex); }));
      var decisions = 0;
      etat.dossiers.forEach(function (d) { d.etapes.forEach(function (e) { if (e.acteur === a && e.fin && e.decision) decisions++; }); });
      html += '<div class="carte-diff" style="--c:' + ACTEURS[a].couleur + '"><h3><i></i>' + ACTEURS[a].nom + '</h3><div class="kpis">' +
        kpi("Différés émis", l.length, decisions ? "soit " + Math.round(l.length / decisions * 100) + " %" : "") +
        kpi("À lever par la DE", aLever.length, retard ? retard + " en retard" : "", aLever.length ? "orange" : "") +
        kpi("En réexamen", rex.length, "") +
        kpi("Levés puis " + (a === "CF" ? "visés" : "payés"), leves, "", "vert") +
        kpi("Délai moyen de levée", f1(dLev), "j ouvr.") +
        kpi("Délai moyen de réexamen", f1(dRex), "j ouvr.") +
        "</div></div>";
    });
    html += "</div></section>";

    var liste = tous.filter(function (x) {
      if (ui.diffActeur !== "tous" && x.acteur !== ui.diffActeur) return false;
      if (ui.diffStatut !== "tous" && x.statut !== ui.diffStatut) return false;
      return true;
    });
    var segA = [["tous", "CF et AC"], ["CF", "Contrôle financier"], ["AC", "Agent comptable"]];
    var segS = [["tous", "Tous"], ["a_lever", "À lever"], ["reexamen", "En réexamen"], ["traite", "Traités"]];
    html += '<section class="panel"><div class="panel-head"><h2>Différés</h2><span class="muted">' + liste.length + " sur " + tous.length + "</span></div>";
    html += '<div class="filters"><div class="seg" role="group" aria-label="Acteur">' + segA.map(function (x) { return '<button data-diff-acteur="' + x[0] + '" aria-pressed="' + (ui.diffActeur === x[0]) + '">' + x[1] + "</button>"; }).join("") + "</div>" +
      '<div class="seg" role="group" aria-label="Statut">' + segS.map(function (x) { return '<button data-diff-statut="' + x[0] + '" aria-pressed="' + (ui.diffStatut === x[0]) + '">' + x[1] + "</button>"; }).join("") + "</div></div>";
    if (!liste.length) return html + '<div class="table-wrap"><div class="empty">' + (tous.length ? "Aucun différé ne correspond aux filtres." : "Aucun différé enregistré. Les différés apparaissent ici dès que le CF ou l\'AC diffère un dossier.") + "</div></div></section>";
    html += '<div class="table-wrap"><table><thead><tr><th>N° OP</th><th>Objet</th><th>Différé par</th><th>Date du différé</th><th>Motif</th><th>Levée par la DE</th><th>Réexamen</th><th>Statut</th></tr></thead><tbody>';
    liste.forEach(function (x) {
      var levee = !x.lev ? "—" : !x.lev.fin ? horloge(x.lev) : '<span class="num">' + duree(x.lev) + " j</span>" + (duree(x.lev) > delai("DE") ? ' <span class="chip rejete" style="font-size:.7rem">hors délai</span>' : "") + '<div class="muted" style="font-size:.78rem">renvoyé le ' + h(fd(x.lev.fin)) + "</div>";
      var reex = !x.rex ? '<span class="muted">—</span>' : !x.rex.fin ? horloge(x.rex) : stamp(x.rex.decision) + ' <span class="num" style="font-size:.82rem">' + duree(x.rex) + " j</span>";
      html += '<tr class="clickable" data-open="' + x.d.id + '" tabindex="0"><td class="ref">' + h(x.d.ref) + '</td><td class="objet">' + h(x.d.objet) + '</td><td><span class="chip ' + x.acteur + '"><i></i>' + x.acteur + "</span>" + (x.rang > 1 ? ' <span class="muted" style="font-size:.78rem">' + x.rang + "e</span>" : "") + '</td><td class="num">' + h(fd(x.e.fin)) +
        '</td><td class="objet" style="font-size:.85rem">' + h(x.e.motif) + (x.lev && x.lev.fin && x.lev.motif ? '<div class="muted" style="font-size:.78rem;margin-top:3px">Réponse DE : ' + h(x.lev.motif) + "</div>" : "") + "</td><td>" + levee + "</td><td>" + reex + "</td><td>" + chipDiffere(x) + "</td></tr>";
    });
    return html + "</tbody></table></div></section>";
  }

  function vueRapports() {
    var st = statsActeurs(etat.dossiers, ui.du, ui.au);
    var html = '<section class="panel"><div class="panel-head"><h2>Performance par acteur</h2><div class="filters" style="margin:0"><label class="label" for="r-du">Du</label><input type="date" id="r-du" value="' + h(ui.du) + '"><label class="label" for="r-au">au</label><input type="date" id="r-au" value="' + h(ui.au) + '"></div></div>';
    html += '<p class="help">Les durées sont comptées en jours ouvrables, du lendemain de la réception jusqu\'à la date de sortie incluse. Samedis, dimanches et jours fériés déclarés dans les paramètres sont exclus. La période filtre les étapes selon leur date de réception.</p>';
    html += '<div class="table-wrap"><table><thead><tr><th>Acteur</th><th class="r">Délai</th><th class="r">Étapes traitées</th><th class="r">Délai moyen</th><th class="r">Délai max</th><th class="r">Dans les délais</th><th class="r">Visés / payés</th><th class="r">Différés</th><th class="r">Rejetés</th><th class="r">En cours</th><th class="r">En retard</th></tr></thead><tbody>';
    ["DE", "CF", "AC"].forEach(function (a) {
      var s = st[a];
      html += '<tr><td><span class="chip ' + a + '"><i></i>' + ACTEURS[a].nom + '</span></td><td class="r num">' + delai(a) + ' j</td><td class="r num">' + s.n + '</td><td class="r num">' + f1(s.moy) + ' j</td><td class="r num">' + (s.n ? s.max + " j" : "—") + '</td><td class="r num">' + (s.n ? Math.round(s.dansDelai / s.n * 100) + " %" : "—") +
        '</td><td class="r num">' + (a === "DE" ? "—" : a === "CF" ? s.vise : s.paye) + '</td><td class="r num">' + (a === "DE" ? "—" : s.differe) + '</td><td class="r num">' + (a === "DE" ? "—" : s.rejete) + '</td><td class="r num">' + s.encours + '</td><td class="r num">' + s.retard + "</td></tr>";
    });
    html += "</tbody></table></div></section>";

    html += '<section class="panel"><div class="panel-head"><h2>Temps passé par dossier</h2><div class="filters" style="margin:0"><button class="btn small" data-act="export-xlsx">Exporter en Excel</button></div></div>';
    html += '<div class="table-wrap"><table><thead><tr><th>N° OP</th><th>Objet</th><th>Situation</th><th class="r">DE</th><th class="r">CF</th><th class="r">AC</th><th class="r">Total</th><th class="r">Allers-retours CF</th></tr></thead><tbody>';
    etat.dossiers.slice().sort(triOP).forEach(function (d) {
      var nbCF = d.etapes.filter(function (e) { return e.acteur === "CF"; }).length;
      html += '<tr class="clickable" data-open="' + d.id + '" tabindex="0"><td class="ref">' + h(d.ref) + '</td><td class="objet">' + h(d.objet) + "</td><td>" + chipPos(d) + "</td>" +
        ["DE", "CF", "AC"].map(function (a) {
          var v = cumulActeur(d, a), n = d.etapes.filter(function (e) { return e.acteur === a; }).length;
          var trop = d.etapes.some(function (e) { return e.acteur === a && duree(e) > delai(a); });
          return '<td class="r num"' + (trop ? ' style="color:var(--bad);font-weight:600"' : "") + ">" + (n ? v + " j" : "—") + "</td>";
        }).join("") + '<td class="r num"><strong>' + dureeTotale(d) + ' j</strong></td><td class="r num">' + nbCF + "</td></tr>";
    });
    if (!etat.dossiers.length) html += '<tr><td colspan="8" class="empty">Aucun dossier.</td></tr>';
    html += "</tbody></table></div></section>";
    return html;
  }

  function vueParametres() {
    var p = etat.params;
    var html = '<section class="panel"><div class="panel-head"><h2>Paramètres</h2></div><form id="form-params" class="form-grid"><fieldset style="display:contents"' + (ui.lecture ? " disabled" : "") + '>';
    ["DE", "CF", "AC"].forEach(function (a) {
      html += '<div class="field"><label class="label" for="p-' + a + '">Délai ' + ACTEURS[a].nom + ' (jours ouvrables)</label><input type="number" min="1" max="60" id="p-' + a + '" value="' + h(p.delais[a]) + '"></div>';
    });
    html += '<div class="field"><label class="label" for="p-devise">Devise</label><input type="text" id="p-devise" value="' + h(p.devise) + '"></div>';
    html += '<div class="field full"><label class="label" for="p-feries">Jours fériés</label><textarea id="p-feries" rows="6">' + h(p.feries) + '</textarea><span class="help">Un jour par ligne. <span class="mono">MM-JJ</span> pour un jour férié fixe chaque année (ex. <span class="mono">12-25</span>), <span class="mono">AAAA-MM-JJ</span> pour une date précise (Pâques, Tabaski, Maouloud…). Ces jours ne sont pas décomptés.</span></div>';
    html += (ui.lecture ? "" : '<div class="actions field full"><button class="btn primary" type="submit">Enregistrer les paramètres</button></div>') + '</fieldset></form></section>';

    html += '<section class="panel"><div class="panel-head"><h2>Sauvegarde des données</h2></div><p class="help">' + (cdb.actif ? (ui.lecture ? "Vous pouvez exporter une copie des dossiers pour les ouvrir dans Excel ou les archiver." : "Les données sont enregistrées en ligne dans la base partagée de l\'application, accessible de partout. Exportez une sauvegarde régulièrement ; l\'import remplace tous les dossiers en ligne.") : srv.actif ? "Les données sont partagées sur le serveur, qui en garde une copie chaque jour. Vous pouvez aussi exporter une sauvegarde ou importer celle d\'un poste utilisé auparavant ; l\'import remplace toutes les données du serveur." : "Les données sont enregistrées dans ce navigateur. Faites une sauvegarde régulière, et utilisez l\'import pour transférer les dossiers sur un autre poste.") + '</p>' +
      '<div class="filters"><button class="btn" data-act="export-xlsx">Exporter en Excel (.xlsx)</button><button class="btn" data-act="export-json">Exporter en JSON</button>' + (ui.lecture ? "" : '<label class="btn" for="import-file">Importer une sauvegarde (JSON)</label><input type="file" id="import-file" accept=".json,application/json" hidden><button class="btn danger" data-act="ask-reset">Effacer toutes les données</button>') + '</div>' +
      '<div id="zone-export"></div><div id="zone-reset"></div></section>';

  function enregistrerAction(d) {
    var c = courante(d), err = document.getElementById("a-err");
    var date = document.getElementById("a-date").value;
    var decEl = dlg.querySelector('input[name="a-dec"]:checked') || document.getElementById("a-dec");
    var dec = decEl.value;
    var motifEl = document.getElementById("a-motif"), motif = motifEl ? motifEl.value.trim() : "";
    function erreur(m) { err.textContent = m; err.hidden = false; }
    if (!date) return erreur("Indiquez la date.");
    if (date < c.debut) return erreur("La date ne peut pas précéder la réception du dossier (" + fd(c.debut) + ").");
    if (date > aujourdhui()) return erreur("La date ne peut pas être dans le futur.");
    if ((dec === "differe" || dec === "rejete") && !motif) return erreur("Précisez le motif du " + (dec === "differe" ? "différé" : "rejet") + ".");
    c.fin = date; c.decision = dec; c.motif = motif;
    if (srv.nom) c.par = srv.nom;
    if (c.acteur === "DE") {
      c.vers = document.getElementById("a-vers").value;
      d.etapes.push({ acteur: c.vers, debut: date, fin: null, decision: null, motif: "" });
    } else if (dec === "paye") { d.statut = "paye"; }
    else if (dec === "rejete") { d.statut = "rejete"; }
    else { d.etapes.push({ acteur: "DE", debut: date, fin: null, decision: null, motif: "" }); }
    var apresDiffere = c.acteur === "DE" && d.etapes.length > 2 && d.etapes[d.etapes.length - 3].decision === "differe";
    valider({ type: "maj", d: d }, d.id, c.acteur === "DE" ? (apresDiffere ? "Différé levé : dossier renvoyé " : "Dossier transmis ") + (c.vers === "AC" ? "à l'" : "au ") + ACTEURS[c.vers].nom + "." : "Décision enregistrée : " + DECISIONS[dec].toLowerCase() + ".");
  }

  function annulerDerniere(d) {
    var last = d.etapes[d.etapes.length - 1];
    if (d.statut !== "en_cours") { last.fin = null; last.decision = null; last.motif = ""; delete last.par; d.statut = "en_cours"; }
    else if (d.etapes.length > 1) {
      var retire = d.etapes.pop();
      var p = d.etapes[d.etapes.length - 1];
      if (retire.reprise) { d.statut = "rejete"; valider({ type: "maj", d: d }, d.id, "Reprise annulée."); return; }
      p.fin = null; p.decision = null; p.motif = ""; delete p.vers; delete p.par;
    } else return;
    valider({ type: "maj", d: d }, d.id, "Dernière action annulée.");
  }

  // ---------- Exports ----------
  function telecharger(nom, contenu, type) {
    if (cdb.downloads) {
      cdb.downloads.save({ filename: nom, data: new Blob([contenu], { type: type }) }).then(function () { toast("Fichier enregistré."); }, function (e) {
        if (!e || e.code !== "declined") toast("Le téléchargement n'a pas pu se faire.");
      });
      return;
    }
    try {
      var blob = new Blob([contenu], { type: type });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = nom;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    } catch (e) { /* téléchargement bloqué : la zone de copie reste disponible */ }
  }

        '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0D4F8B"/><bgColor indexed="64"/></patternFill></fill></fills>' +
        '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
        '<cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs>' +
        '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>']
    ];
    feuilles.forEach(function (f, i) { fichiers.push(["xl/worksheets/sheet" + (i + 1) + ".xml", feuilleXml(f)]); });
    return zip(fichiers);
  }

  var tableCrc = null;
  function crc32(octets) {
    if (!tableCrc) {
      tableCrc = [];
      for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; tableCrc[n] = c >>> 0; }
    }
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < octets.length; i++) crc = tableCrc[(crc ^ octets[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  // Archive ZIP « stockée » (méthode 0) : suffisante pour un classeur Excel.
  function zip(fichiers) {
    var enc = new TextEncoder(), parts = [], central = [], decalage = 0;
    function u16(v) { return [v & 0xFF, (v >>> 8) & 0xFF]; }
    function u32(v) { return [v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF]; }
    fichiers.forEach(function (f) {
      var nom = enc.encode(f[0]), donnees = enc.encode(f[1]), crc = crc32(donnees), t = donnees.length;
      var entete = [].concat([0x50, 0x4B, 0x03, 0x04], u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(t), u32(t), u16(nom.length), u16(0));
      parts.push(new Uint8Array(entete), nom, donnees);
      central.push(new Uint8Array([].concat([0x50, 0x4B, 0x01, 0x02], u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(t), u32(t), u16(nom.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(decalage))), nom);
      decalage += entete.length + nom.length + t;
    });
    var tailleCentral = central.reduce(function (s, p) { return s + p.length; }, 0);
    var fin = new Uint8Array([].concat([0x50, 0x4B, 0x05, 0x06], u16(0), u16(0), u16(fichiers.length), u16(fichiers.length), u32(tailleCentral), u32(decalage), u16(0)));
    var tout = parts.concat(central, [fin]), total = tout.reduce(function (s, p) { return s + p.length; }, 0);
    var sortie = new Uint8Array(total), pos = 0;
    tout.forEach(function (p) { sortie.set(p, pos); pos += p.length; });
    return sortie;
  }

  var TYPE_XLSX = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  function exporterExcel() {
    telecharger("suivi-dossiers-prseb-" + aujourdhui() + ".xlsx", classeurExcel(), TYPE_XLSX);
    if (!cdb.downloads) toast("Fichier Excel généré.");
  }
  function exporterJson() {
    var json = JSON.stringify({ dossiers: etat.dossiers, params: etat.params }, null, 2);
    telecharger("sauvegarde-prseb-" + aujourdhui() + ".json", json, "application/json");
    if (!cdb.downloads) toast("Sauvegarde JSON générée.");
    // Version en ligne sans téléchargement autorisé : le texte reste copiable.
    if (window.claude && !cdb.downloads) {
      var z = document.getElementById("zone-export");
      if (z) z.innerHTML = '<div class="field" style="margin-top:12px"><label class="label" for="json-out">Le téléchargement n\'est pas disponible ici : copiez ce texte dans un fichier .json</label><textarea id="json-out" rows="6" readonly class="mono" style="font-size:.78rem">' + h(json) + "</textarea></div>";
    }
  }

  // ---------- Événements ----------
  document.querySelector("nav.tabs").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-tab]"); if (!b) return;
    ui.onglet = b.dataset.tab;
    try { history.replaceState(null, "", "#" + ui.onglet); } catch (e) { /* ignore */ }
    render();
  });
  document.getElementById("btn-nouveau").addEventListener("click", function () { formDossier(null); });

  function surOuvrir(ev) {
    var row = ev.target.closest("[data-open]");
    if (row) detail(row.dataset.open);
  }
  app.addEventListener("click", function (ev) {
    var act = ev.target.closest("[data-act]");
    if (act) {
      var a = act.dataset.act;
      if (a === "vider-exemples") { etat.dossiers = etat.dossiers.filter(function (d) { return !d.exemple; }); valider({ type: "exemples" }, null, "Exemples supprimés."); }
      else if (a === "migrer") {
        var locaux = dossiersLocaux(), ch = Promise.resolve(), n = 0;
        act.disabled = true;
        locaux.forEach(function (d) { ch = ch.then(function () { return persisterDb({ type: "creer", d: d }).then(function () { n++; }); }); });
        ch.then(function () {
          try { localStorage.removeItem(CLE); } catch (e) { /* ignore */ }
          render(); toast(n + " dossier(s) ajouté(s) à la base partagée.");
        }, function (e) { render(); toast(e.message); });
      }
      else if (a === "export-xlsx") exporterExcel();
      else if (a === "export-json") exporterJson();
      else if (a === "ask-reset") { document.getElementById("zone-reset").innerHTML = '<div class="confirm" style="margin-top:12px">Effacer tous les dossiers ' + (srv.actif || cdb.actif ? "partagés, pour tous les utilisateurs" : "enregistrés dans ce navigateur") + ' ? <button class="btn small danger" data-act="reset">Oui, tout effacer</button><button class="btn small" data-act="no-reset">Non</button></div>'; }
      else if (a === "no-reset") { document.getElementById("zone-reset").innerHTML = ""; }
      else if (a === "reset") { etat.dossiers = []; valider({ type: "tout" }, null, "Toutes les données ont été effacées."); }
      return;
    }
    var fa = ev.target.closest("[data-diff-acteur]"), fs = ev.target.closest("[data-diff-statut]");
    if (fa) { ui.diffActeur = fa.dataset.diffActeur; render(); return; }
    if (fs) { ui.diffStatut = fs.dataset.diffStatut; render(); return; }
    var pos = ev.target.closest("[data-pos]");
    if (pos) { ui.position = pos.dataset.pos; render(); return; }
    surOuvrir(ev);
  });
  app.addEventListener("keydown", function (ev) { if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-open]")) { ev.preventDefault(); surOuvrir(ev); } });
  app.addEventListener("input", function (ev) {
    if (ev.target.id === "f-q") {
      ui.recherche = ev.target.value; var pos = ev.target.selectionStart;
      render(); var el = document.getElementById("f-q"); el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) { /* ignore */ }
    }
  });
  app.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.id === "f-retard") { ui.retardSeul = t.checked; render(); }
    else if (t.id === "r-du") { ui.du = t.value; render(); }
    else if (t.id === "r-au") { ui.au = t.value; render(); }
    else if (t.id === "import-file" && t.files[0]) {
      var r = new FileReader();
      r.onload = function () {
        try {
          var o = JSON.parse(r.result);
          if (!o || !Array.isArray(o.dossiers)) throw new Error();
          var dbl = doublonsOP(o.dossiers);
          if (dbl.length) { toast("Import refusé : n° d'ordre de paiement en double (" + dbl.slice(0, 3).join(", ") + ")."); return; }
          etat.dossiers = o.dossiers;
          etat.params = Object.assign({}, defautParams, o.params || {});
          valider({ type: "tout" }, null, o.dossiers.length + " dossier(s) importé(s).");
        } catch (e) { toast("Ce fichier n'est pas une sauvegarde valide de l'application."); }
      };
      r.readAsText(t.files[0]);
    }
  });
  app.addEventListener("submit", function (ev) {
    if (ev.target.id === "form-connexion") {
      ev.preventDefault();
      var nom = document.getElementById("c-nom").value.trim(), mdp = document.getElementById("c-mdp");
      var err = document.getElementById("c-err"), btn = ev.target.querySelector("button");
      btn.disabled = true;
      appel("POST", "/api/connexion", { nom: nom, motDePasse: mdp ? mdp.value : "" }).then(function (r) {
        srv.jeton = r.jeton; srv.nom = r.nom; srv.role = r.role; ui.lecture = r.role === "lecture";
        try { localStorage.setItem(CLE_SESSION, JSON.stringify(r)); localStorage.setItem(CLE_SESSION + "-nom", r.nom); } catch (e) { /* ignore */ }
        return rechargerServeur();
      }).then(function () { render(); }, function (e) { err.textContent = e.message; err.hidden = false; btn.disabled = false; });
      return;
    }
    if (ev.target.id !== "form-params") return;
    ev.preventDefault();
    ["DE", "CF", "AC"].forEach(function (a) { var v = parseInt(document.getElementById("p-" + a).value, 10); etat.params.delais[a] = v > 0 ? v : 5; });
    etat.params.devise = document.getElementById("p-devise").value.trim() || "FCFA";
    etat.params.feries = document.getElementById("p-feries").value;
    valider({ type: "params" }, null, "Paramètres enregistrés.");
  });

  dlg.addEventListener("click", function (ev) {
    if (ev.target === dlg) { fermerDlg(); return; }
    var ouvrir = ev.target.closest("[data-ouvrir]");
    if (ouvrir) { detail(ouvrir.dataset.ouvrir); return; }
    var act = ev.target.closest("[data-act]"); if (!act) return;
    var a = act.dataset.act, d = trouver(dlgId());
    if (a === "close") fermerDlg();
    else if (a === "copier-lien") {
      var champ = document.getElementById("lien-app");
      var choisir = function () { champ.focus(); champ.select(); toast("Lien sélectionné : copiez-le avec Ctrl+C."); };
      try { navigator.clipboard.writeText(LIEN_EN_LIGNE).then(function () { toast("Lien copié. Collez-le dans un e-mail ou un message."); }, choisir); } catch (e) { choisir(); }
    }
    else if (a === "modifier") formDossier(d);
    else if (a === "ask-suppr") detail(d.id, "suppr");
    else if (a === "detail") detail(d.id);
    else if (a === "suppr") { etat.dossiers = etat.dossiers.filter(function (x) { return x !== d; }); fermerDlg(); valider({ type: "suppr", d: d }, null, "Dossier " + d.ref + " supprimé."); }
    else if (a === "annuler-derniere") annulerDerniere(d);
    else if (a === "reprendre") {
      var last = d.etapes[d.etapes.length - 1];
      d.etapes.push({ acteur: "DE", debut: last.fin || aujourdhui(), fin: null, decision: null, motif: "", reprise: true });
      d.statut = "en_cours"; valider({ type: "maj", d: d }, d.id, "Dossier repris à la Direction exécutive.");
    }
  });
  dlg.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (ev.target.id === "form-action") { enregistrerAction(trouver(dlgId())); return; }
    if (ev.target.id !== "form-dossier") return;
    var id = ev.target.dataset.id, err = document.getElementById("d-err");
    var ref = nettoyerOP(document.getElementById("d-ref").value), objet = document.getElementById("d-objet").value.trim();
    if (!ref || !objet) { err.textContent = "Le n° d'ordre de paiement et l'objet sont obligatoires."; err.hidden = false; return; }
    var existant = parOP(ref, id);
    if (existant) {
      err.innerHTML = "L'ordre de paiement " + h(existant.ref) + ' est déjà enregistré. <button type="button" class="lien" data-ouvrir="' + h(existant.id) + '">Ouvrir ce dossier</button>';
      err.hidden = false; return;
    }
    var m = document.getElementById("d-montant").value;
    var champs = { ref: ref, objet: objet, beneficiaire: document.getElementById("d-benef").value.trim(), montant: m === "" ? "" : +m, nature: document.getElementById("d-nature").value };
    if (id) { Object.assign(trouver(id), champs); valider({ type: "maj", d: trouver(id) }, id, "Dossier modifié."); return; }
    var date = document.getElementById("d-date").value || aujourdhui();
    if (date > aujourdhui()) { err.textContent = "La date d'arrivée ne peut pas être dans le futur."; err.hidden = false; return; }
    var d = Object.assign({ id: uid(), dateArrivee: date, statut: "en_cours", etapes: [{ acteur: "DE", debut: date, fin: null, decision: null, motif: "" }] }, champs);
    etat.dossiers.push(d); ui.onglet = "dossiers"; valider({ type: "creer", d: d }, d.id, "Dossier " + ref + " enregistré.");
  });

  // ---------- Démarrage ----------
  document.getElementById("session").addEventListener("click", function (ev) {
    if (ev.target.closest("#btn-partage")) { fenetrePartage(); return; }
    if (ev.target.id !== "btn-deco") return;
    appel("POST", "/api/deconnexion").catch(function () { /* ignore */ });
    oublierSession();
  });

  // Rafraîchit les données quand un collègue a enregistré une modification.
  function surveiller() {
    if (!srv.actif || !srv.jeton || document.hidden) return;
    appel("GET", "/api/revision").then(function (r) {
      if (r.revision === srv.revision) return;
      return rechargerServeur().then(rafraichirDistant);
    }).catch(function () { /* nouvel essai au prochain passage */ });
  }

  var hash = (location.hash || "").slice(1);
  if (["tableau", "dossiers", "differes", "rapports", "parametres"].indexOf(hash) >= 0) ui.onglet = hash;

  function demarrerLocal() { charger(); render(); }

  // Dossiers saisis dans ce navigateur (hors exemples), à verser dans la base partagée.
  function dossiersLocaux() {
    try {
      var o = JSON.parse(localStorage.getItem(CLE) || "null");
      var deja = {};
      etat.dossiers.forEach(function (d) { deja[d.id] = true; deja["r:" + cleOP(d.ref)] = true; });
      return o && Array.isArray(o.dossiers) ? o.dossiers.filter(function (d) { return !d.exemple && !deja[d.id] && !deja["r:" + cleOP(d.ref)]; }) : [];
    } catch (e) { return []; }
  }

  // Après une mise à jour venue d'un autre poste : rafraîchit sans gêner une saisie en cours.
  function rafraichirDistant() {
    var actif = document.activeElement;
    if (actif && app.contains(actif) && /INPUT|TEXTAREA|SELECT/.test(actif.tagName)) return;
    render();
    if (dlg.open && !dlg.querySelector("form, .confirm")) {
      var id = dlgId();
      if (id && trouver(id)) detail(id); else if (id) fermerDlg();
    } else if (dlg.open && ui.lecture) { var i2 = dlgId(); if (i2 && trouver(i2)) detail(i2); }
  }

  function demarrerClaude() {
    ui.chargement = true; render();
    Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("downloads")]).then(function (r) {
      var db = r[0], user = r[1];
      cdb.downloads = r[2];
      if (!db) { ui.chargement = false; ui.indispo = true; render(); return; }
      cdb.actif = true; cdb.db = db;
      ui.lecture = true;
      var proprio = user ? user.isOwner() : Promise.resolve(false);
      var recu = { dossiers: false, params: false };
      function pret() {
        if (!recu.dossiers || !recu.params) return;
        if (ui.chargement) { ui.chargement = false; render(); } else rafraichirDistant();
      }
      proprio.then(function (ok) { ui.lecture = !ok; if (!ui.chargement) render(); });
      db.collection("dossiers").onSnapshot(function (snap) {
        etat.dossiers = snap.docs.map(function (d) { return propre(d.data()); });
        recu.dossiers = true; pret();
      }, function () { toast("La connexion à la base a été interrompue. Rechargez la page."); });
      db.doc("config/params").onSnapshot(function (snap) {
        var o = snap.exists ? propre(snap.data()) : {};
        etat.params = Object.assign({}, defautParams, o);
        etat.params.delais = Object.assign({}, defautParams.delais, o.delais || {});
        cacheFeries = null;
        recu.params = true; pret();
      }, function () { /* signalé par l'abonnement aux dossiers */ });
    });
  }

  if (window.claude && typeof window.claude.use === "function") demarrerClaude();
  else if (/^https?:$/.test(location.protocol)) {
    fetch("/api/config").then(function (r) {
      if (!r.ok || (r.headers.get("Content-Type") || "").indexOf("json") < 0) throw new Error();
      return r.json();
    }).then(function (cfg) {
      srv.actif = true; srv.motDePasseRequis = !!cfg.motDePasseRequis;
      try { var s = JSON.parse(localStorage.getItem(CLE_SESSION) || "null"); if (s) { srv.jeton = s.jeton; srv.nom = s.nom; srv.role = s.role; ui.lecture = s.role === "lecture"; } } catch (e) { /* ignore */ }
      setInterval(surveiller, 15000);
      document.addEventListener("visibilitychange", surveiller);
      if (!srv.jeton) { render(); return; }
      return rechargerServeur().then(render, function (e) { render(); toast(e.message); });
    }).catch(demarrerLocal);
  } else demarrerLocal();
})();
</script>
</body>
</html>
